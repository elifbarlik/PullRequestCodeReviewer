name: Phase 4 Production Validation

on:
  push:
    branches:
      - main

jobs:
  production-validation:
    runs-on: ubuntu-latest
    env:
      FLY_APP: pr-reviewer-quiet-fire-1218
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wait for production deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "https://${FLY_APP}.fly.dev/health" >/tmp/health.json; then
              cat /tmp/health.json
              python - <<'PY' /tmp/health.json
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["status"] == "ok", data
          PY
              echo "production-health: PASS"
              break
            fi
            echo "Waiting for production deployment... attempt $i/30"
            sleep 5
          done

      - name: Verify production LOG_FORMAT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          log_format="$(flyctl ssh console -a "$FLY_APP" -q -C 'printenv LOG_FORMAT' | tail -n 1 | tr -d '\r')"
          echo "LOG_FORMAT=$log_format"
          test "$log_format" = "json"

      - name: Capture and verify structured application log
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          # Start the live Fly log stream BEFORE emitting the smoke record.
          # --no-tail only reads the current buffer; it can miss a record that
          # is emitted immediately before the snapshot is requested.
          flyctl logs -a "$FLY_APP" --json > fly-production-logs.jsonl &
          logs_pid=$!

          cleanup() {
            kill "$logs_pid" 2>/dev/null || true
            wait "$logs_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 2

          result="$(flyctl ssh console -a "$FLY_APP" -q -C 'python -c "import os,urllib.request; r=urllib.request.Request(\"http://127.0.0.1:8000/admin/logging-test\",method=\"POST\",headers={\"X-Admin-Token\":os.environ[\"ADMIN_SECRET\"]}); print(urllib.request.urlopen(r,timeout=10).read().decode())"')"
          echo "$result"
          python - <<'PY' "$result"
          import json, sys
          data = json.loads(sys.argv[1])
          assert data["status"] == "logged", data
          print("structured-log-endpoint: PASS")
          PY

          sleep 3
          cleanup
          trap - EXIT

          python - <<'PY'
          import json
          target = "SecPR-TR structured logging smoke test"
          with open("fly-production-logs.jsonl", encoding="utf-8") as f:
              for raw in f:
                  try:
                      outer = json.loads(raw)
                  except json.JSONDecodeError:
                      continue

                  candidates = [outer]
                  message = str(outer.get("message") or outer.get("text") or "")
                  if message:
                      try:
                          decoded = json.loads(message)
                          if isinstance(decoded, dict):
                              candidates.append(decoded)
                      except json.JSONDecodeError:
                          pass

                  for item in candidates:
                      if isinstance(item, dict) and item.get("message") == target:
                          print(item)
                          print("structured-log-output: PASS")
                          raise SystemExit(0)

          raise SystemExit("structured log smoke record not found in live log stream")
          PY
      - name: Trigger Sentry smoke test when configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          sentry="$(python - <<'PY'
          import json, urllib.request
          data=json.load(urllib.request.urlopen("https://${FLY_APP}.fly.dev/health"))
          print(data["checks"].get("sentry","unknown"))
          PY
          )"
          if [ "$sentry" != "configured" ]; then
            echo "sentry-smoke: SKIPPED (SENTRY_DSN is not configured)"
            exit 0
          fi
          result="$(flyctl ssh console -a "$FLY_APP" -q -C 'python -c "import os,urllib.request; r=urllib.request.Request(\"http://127.0.0.1:8000/admin/sentry-test\",method=\"POST\",headers={\"X-Admin-Token\":os.environ[\"ADMIN_SECRET\"]}); print(urllib.request.urlopen(r,timeout=10).read().decode())"')"
          echo "$result"
          python - <<'PY' "$result"
          import json, sys
          data=json.loads(sys.argv[1])
          assert data.get("event_id"), data
          print("sentry-smoke: PASS", data["event_id"])
          PY

      - name: Upload production log evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4-production-logs
          path: fly-production-logs.jsonl
          if-no-files-found: error
