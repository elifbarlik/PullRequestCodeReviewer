name: Phase 4 Production Validation

on:
  push:
    branches:
      - main
      - ops/phase4-production-validation

jobs:
  production-validation:
    runs-on: ubuntu-latest
    env:
      FLY_APP: pr-reviewer-quiet-fire-1218
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify production health and Sentry configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          health="$(curl -fsS "https://${FLY_APP}.fly.dev/health")"
          echo "$health"
          python - <<'PY' "$health"
          import json, sys
          data = json.loads(sys.argv[1])
          assert data["status"] == "ok", data
          print("health: PASS")
          print("sentry:", data["checks"].get("sentry", "unknown"))
          PY

      - name: Verify production LOG_FORMAT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          log_format="$(flyctl ssh console -a "$FLY_APP" -q -C 'printenv LOG_FORMAT' | tail -n 1 | tr -d '\r')"
          echo "LOG_FORMAT=$log_format"
          test "$log_format" = "json"
          echo "production LOG_FORMAT: PASS"

      - name: Trigger authenticated Sentry production smoke test when configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          health="$(curl -fsS "https://${FLY_APP}.fly.dev/health")"
          sentry="$(python - <<'PY' "$health"
          import json, sys
          print(json.loads(sys.argv[1])["checks"].get("sentry", "unknown"))
          PY
          )"
          if [ "$sentry" != "configured" ]; then
            echo "sentry-smoke: SKIPPED (SENTRY_DSN is not configured in production)"
            exit 0
          fi
          result="$(flyctl ssh console -a "$FLY_APP" -q -C "sh -lc 'curl -fsS -H \"X-Admin-Token: \$ADMIN_SECRET\" http://127.0.0.1:8000/admin/sentry-test'")"
          echo "$result"
          python - <<'PY' "$result"
          import json, sys
          data = json.loads(sys.argv[1])
          assert data["status"] == "sent", data
          assert data.get("event_id"), data
          print("sentry-smoke: PASS")
          print("sentry-event-id:", data["event_id"])
          PY

      - name: Capture production logs around the smoke test
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS "https://${FLY_APP}.fly.dev/health" >/dev/null
          flyctl logs -a "$FLY_APP" --no-tail --json > fly-production-logs.jsonl
          echo "---- health/access log evidence ----"
          python - <<'PY'
          import json
          found = False
          structured = False
          with open("fly-production-logs.jsonl", encoding="utf-8") as f:
              for raw in f:
                  try:
                      obj = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  message = str(obj.get("message") or obj.get("text") or "")
                  if "GET /health" in message or "/health" in message:
                      print(message)
                      found = True
                      if message.lstrip().startswith("{"):
                          structured = True
          if not found:
              print("No message field matching /health was found in the current Fly log buffer.")
          if structured:
              print("structured-log-message: PASS")
          else:
              print("WARNING: no structured application log message detected in the current Fly log buffer")
          print("structured_message_count:", int(structured))
          PY
          echo "---- last 40 raw Fly log records ----"
          tail -n 40 fly-production-logs.jsonl

      - name: Upload production log evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4-production-logs
          path: fly-production-logs.jsonl
          if-no-files-found: error
