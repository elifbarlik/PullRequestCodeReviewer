# Deployment is intentionally manual to prevent accidental hosted-service charges.
name: Fly Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Choose yes only after confirming the Fly.io app and billing are active."
        required: true
        type: choice
        options:
          - no
          - yes
        default: no

jobs:
  deploy:
    name: Deploy app
    if: ${{ inputs.confirm_deploy == 'yes' }}
    runs-on: ubuntu-latest
    concurrency: deploy-group

    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
