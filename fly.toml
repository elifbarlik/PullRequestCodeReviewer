# fly.toml app configuration file generated for pr-reviewer-quiet-fire-1218 on 2026-09-03T14:31:29+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pr-reviewer-quiet-fire-1218'
primary_region = 'fra'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  # Faz 4.4: en az 1 makine sıcak — makine uyuyunca ilk webhook cold-start'a
  # takılır, GitHub 10 sn'de timeout edip retry eder (kullanıcı 2 yorum görür).
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  # Semgrep CPU-bound; --jobs ile çok çekirdek kullanıyoruz.
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
