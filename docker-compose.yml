services:
  pr-reviewer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secpr-tr
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_APP_PRIVATE_KEY_PATH=${GITHUB_APP_PRIVATE_KEY_PATH:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      # DB varsayılan olarak açık — devre dışı bırakmak için .env'de DATABASE_URL'i boş bırakın
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://secpr:${POSTGRES_PASSWORD:-secpr}@db:5432/secpr}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: secpr-tr-db
    environment:
      POSTGRES_DB: secpr
      POSTGRES_USER: secpr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secpr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secpr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
